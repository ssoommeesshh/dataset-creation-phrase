[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planner-dataset"
version = "0.1.0"
description = "CPU foundation for auditable prosody-planner dataset creation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
planner-dataset = "planner_dataset.cli:main"
